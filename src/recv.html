<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR 수신</title>
<style>
:root{
  --bg:#EDF0F2; --panel:#FFFFFF; --ink:#16202A; --muted:#5D6974; --line:#CDD4DA;
  --cell:#D2D9DF; --got:#0E7A66; --warn:#B4441C; --cam:#0F1418;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151A; --panel:#182028; --ink:#E4EAEF; --muted:#8E9AA5; --line:#2A343E;
    --cell:#25303A; --got:#3AC4A2; --warn:#F08A5D; --cam:#06090B; color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.05rem;font-weight:650;margin:0;letter-spacing:-.01em}

.cam{position:relative;width:100%;aspect-ratio:4/3;margin:0 auto;background:var(--cam);border-radius:14px;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.cam.usb video,.cam:not(.usb) canvas{display:none}
.cam .guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:1;height:92%;border:2px solid rgba(255,255,255,.55);border-radius:10px;pointer-events:none}
.cam .empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#AEB8C1;font-size:.95rem}
.cam.on .empty{display:none}
.cam:not(.on) .guide,.cam:not(.aim) .guide{display:none}

.controls{display:flex;flex-wrap:wrap;gap:8px}
button,.btn,select{font:inherit;font-size:.95rem;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--got);border-color:var(--got);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#06231C}}
button:focus-visible,.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--got);outline-offset:2px}
select{max-width:100%}
input[type=file]{display:none}

.progress{display:flex;flex-direction:column;gap:8px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.count span{color:var(--muted);font-variant-numeric:tabular-nums}
#grid{display:block;max-width:100%;image-rendering:pixelated}
#note{color:var(--muted);font-size:.9rem;min-height:1.4em}
#note.err{color:var(--warn)}

#list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .name{font-weight:600;word-break:break-all}
.item .meta{color:var(--muted);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.item textarea{width:100%;min-height:7em;resize:vertical;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.item img{max-width:100%;max-height:50vh;border-radius:8px;align-self:flex-start}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.item .warn{color:var(--warn);font-size:.85rem}
footer{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>QR 수신</h1>

  <div class="cam" id="cam">
    <video id="vid" playsinline muted></video>
    <canvas id="usbPreview" aria-label="USB 캡쳐보드 영상"></canvas>
    <div class="guide"></div>
    <div class="empty">카메라나 캡쳐보드를 켜고 송신 화면의 QR을 비추세요</div>
  </div>

  <div class="controls">
    <button class="primary" id="camBtn">카메라 켜기</button>
    <select id="camSel" hidden aria-label="입력 장치"></select>
    <label class="btn" for="imgIn">이미지에서 읽기</label>
    <input type="file" id="imgIn" accept="image/*" multiple>
    <button id="resetBtn">진행 초기화</button>
  </div>

  <section class="progress" aria-live="polite">
    <div class="count"><b id="cnt">0 / 0</b><span id="rate">QR을 기다리는 중</span></div>
    <canvas id="grid" width="0" height="0"></canvas>
    <div id="note"></div>
  </section>

  <section id="list"></section>

  <footer id="eng"></footer>
</main>

<script>/*JSQR*/</script>
<script>
'use strict';
const A = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
const $ = id => document.getElementById(id);
const vid = $('vid'), cam = $('cam'), camBtn = $('camBtn'), camSel = $('camSel'), grid = $('grid'),
      cnt = $('cnt'), rate = $('rate'), note = $('note'), list = $('list');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });

let stream = null, det = null, loopToken = 0;
const app = window.AndroidBridge || null;   // 안드로이드 앱(WebView) 안에서 실행될 때만 존재
const hasUsb = !!(app && app.listUsbCameras && app.startUsbCamera);
const usbPreview = $('usbPreview'), usbContext = usbPreview.getContext('2d');
let usbActive = false, usbId = '', usbFrameBusy = false, usbFrameSession = 0, nativeDevices = [], deviceListToken = 0;
window.appPause = () => { stopCam(); };
function toB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
let cur = null;               // { id, n, parts: [], got, t0, cs, cols }
const done = new Set();       // 끝난 전송 id (같은 QR이 계속 보여도 다시 받지 않음)

// ── 인식 엔진 ──
let engine = 'jsQR', inputInfo = '';
(async () => {
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) {
      det = new BarcodeDetector({ formats: ['qr_code'] });
      engine = '브라우저 내장';
    }
  } catch (e) {}
  footer();
})();
function footer() { $('eng').textContent = '인식 엔진: ' + engine + (inputInfo ? ', 입력: ' + inputInfo : ''); }

// ── 입력 장치 (카메라 / 캡쳐보드) ──
const DEV_KEY = 'qr-recv-device';
const store = {
  get() { try { return localStorage.getItem(DEV_KEY) || ''; } catch (e) { return ''; } },
  set(v) { try { v ? localStorage.setItem(DEV_KEY, v) : localStorage.removeItem(DEV_KEY); } catch (e) {} }
};
// 캡쳐보드는 보통 웹캠(UVC)처럼 잡히고 이름으로 구분된다
const CAPTURE_RE = /capture|hdmi|cam ?link|elgato|avermedia|live gamer|usb ?video|usb3\.0 ?hd|macrosilicon|ms21\d\d|grabber/i;
const tagOf = label => CAPTURE_RE.test(label || '') ? '캡쳐보드' : /external/i.test(label || '') ? '외부 USB' : '';

function stopCam() {
  loopToken++;
  if (hasUsb) app.stopUsbCamera();
  usbActive = false; usbId = ''; usbFrameBusy = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; vid.srcObject = null;
  cam.classList.remove('on', 'aim', 'usb');
  camBtn.textContent = '카메라 켜기';
  inputInfo = ''; footer();
}

async function startCam(deviceId) {
  const requested = deviceId ?? (camSel.value || store.get());
  stopCam();
  const my = loopToken;
  if (hasUsb) {
    await listDevices(requested);
    if (my !== loopToken) return;
    deviceId = camSel.value;
    if (deviceId.startsWith('usb:')) {
      usbActive = true; usbId = deviceId; roi = null;
      camBtn.textContent = '연결 취소';
      say('USB 캡쳐보드 연결 중입니다. 카메라·USB 접근 권한을 요청하면 허용하세요.');
      app.startUsbCamera(deviceId, my);
      return;
    }
  } else deviceId = requested;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say('이 페이지에서는 카메라를 쓸 수 없습니다. https, localhost, 또는 로컬 파일로 여세요. 이미지에서 읽기는 쓸 수 있습니다.', true);
    return;
  }
  const size = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  const open = id => navigator.mediaDevices.getUserMedia({
    audio: false,
    video: id ? { deviceId: { exact: id }, ...size } : { facingMode: { ideal: 'environment' }, ...size }
  });
  let opened;
  try {
    try { opened = await open(deviceId); }
    catch (e) {
      // 저장해 둔 장치가 빠져 있으면 기본 카메라로
      if (deviceId && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError')) { store.set(''); opened = await open(''); }
      else throw e;
    }
  } catch (e) {
    if (my !== loopToken) return;
    const why = {
      NotAllowedError: '권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용하세요.',
      NotReadableError: '다른 프로그램(OBS, 화상회의 앱 등)이 장치를 쓰고 있습니다. 그 프로그램을 닫고 다시 켜세요.',
      NotFoundError: '연결된 카메라나 캡쳐보드가 없습니다.'
    }[e.name] || e.message;
    say('입력 장치를 열지 못했습니다: ' + why, true);
    return;
  }
  if (my !== loopToken) { opened.getTracks().forEach(t => t.stop()); return; }
  stream = opened;
  vid.srcObject = stream;
  try { await vid.play(); } catch (e) {}
  if (my !== loopToken) return;
  const st = stream.getVideoTracks()[0].getSettings();
  cam.classList.add('on');
  cam.classList.toggle('aim', st.facingMode === 'environment');   // 조준 네모는 휴대폰 후면 카메라일 때만
  camBtn.textContent = '카메라 끄기';
  say('');
  await listDevices();
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
  roi = null;
  const next = () => vid.requestVideoFrameCallback ? vid.requestVideoFrameCallback(step) : requestAnimationFrame(step);
  const step = async () => {
    if (my !== loopToken) return;
    try { await scanVideo(); } catch (e) {}
    if (my === loopToken) next();
  };
  next();
}

async function listDevices(preferred) {
  const request = ++deviceListToken;
  let devs = [], usb = [];
  if (hasUsb) {
    try { usb = JSON.parse(app.listUsbCameras()); } catch (e) { say('USB 장치 목록을 읽지 못했습니다.', true); }
  }
  try { devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); }
  catch (e) { /* WebView 목록이 없어도 네이티브 USB 입력은 사용할 수 있다. */ }
  if (request !== deviceListToken) return;
  nativeDevices = usb;
  const curId = stream ? stream.getVideoTracks()[0].getSettings().deviceId || '' : '';
  const wanted = preferred ?? (usbActive ? usbId : stream ? curId : camSel.value || store.get() || usb[0]?.id || '');
  camSel.innerHTML = '';
  usb.forEach(d => camSel.add(new Option(d.label, d.id)));
  if (hasUsb) camSel.add(new Option('휴대폰 카메라 (자동)', ''));
  devs.forEach((d, i) => {
    if (hasUsb && !d.deviceId) return;
    const tag = tagOf(d.label);
    camSel.add(new Option((d.label || '카메라 ' + (i + 1)) + (tag ? ' (' + tag + ')' : ''), d.deviceId));
  });
  camSel.value = wanted;
  if (camSel.selectedIndex < 0) camSel.selectedIndex = 0;
  camSel.hidden = camSel.options.length < 2;
  const ext = devs.find(d => tagOf(d.label)), now = devs.find(d => d.deviceId === curId);
  if (stream && usb.length) say('USB 캡쳐보드가 연결되어 있습니다. 위 입력 목록에서 고르세요.');
  else if (stream && ext && !(now && tagOf(now.label)))
    say(tagOf(ext.label) + '로 보이는 장치가 있습니다: ' + ext.label + '. 위 입력 목록에서 고르세요.');
}
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener('devicechange', () => { if (stream || hasUsb) listDevices(); });

window.onUsbDevicesChanged = async () => {
  await listDevices();
  if (usbActive && !nativeDevices.some(d => d.id === usbId)) {
    stopCam();
    say('USB 캡쳐보드가 분리되었습니다. 다시 연결하고 카메라를 켜세요.', true);
  }
};
window.onUsbStarted = (session, w, h) => {
  if (session !== loopToken || !usbActive) return;
  cam.classList.add('on', 'usb');
  cam.classList.remove('aim');
  camBtn.textContent = '카메라 끄기';
  store.set(usbId);
  fitPreview(w, h);
  say('');
};
window.onUsbError = (session, message) => {
  if (session !== loopToken || !usbActive) return;
  stopCam();
  say(message, true);
};
window.onUsbFrame = (session, b64, w, h) => {
  if (session !== loopToken || !usbActive || usbFrameBusy) return false;
  usbFrameBusy = true; usbFrameSession = session;
  const image = new Image();
  const finish = () => {
    if (usbFrameSession === session) usbFrameBusy = false;
    app.usbFrameDone(session);
  };
  image.onload = async () => {
    try {
      if (session !== loopToken || !usbActive) return;
      if (usbPreview.width !== w || usbPreview.height !== h) { usbPreview.width = w; usbPreview.height = h; }
      usbContext.drawImage(image, 0, 0, w, h);
      await scanSource(usbPreview, w, h);
    } catch (e) { /* 다음 프레임에서 다시 시도한다. */ }
    finally { finish(); }
  };
  image.onerror = finish;
  image.src = 'data:image/jpeg;base64,' + b64;
  return true;
};
if (hasUsb) listDevices();

function fitPreview(width, height) {
  const w = typeof width === 'number' ? width : vid.videoWidth;
  const h = typeof height === 'number' ? height : vid.videoHeight;
  if (!w || !h) return;
  const r = w / h;
  cam.style.aspectRatio = w + '/' + h;
  cam.style.width = 'min(100%, calc(58vh * ' + r.toFixed(4) + '))';
  const g = cam.querySelector('.guide');
  if (r >= 1) { g.style.height = '92%'; g.style.width = 'auto'; }
  else { g.style.width = '92%'; g.style.height = 'auto'; }
  const fr = stream && stream.getVideoTracks()[0].getSettings().frameRate;
  inputInfo = (usbActive ? 'USB ' : '') + w + '×' + h + (fr ? ' ' + Math.round(fr) + 'fps' : '');
  footer();
}
vid.addEventListener('loadedmetadata', fitPreview);
vid.addEventListener('resize', fitPreview);

camBtn.onclick = () => stream || usbActive ? stopCam() : startCam();
camSel.onchange = () => { store.set(camSel.value); startCam(camSel.value); };

// jsQR 스캔 영역: QR을 한 번 찾으면 그 주변만 원본 해상도로 읽는다(빠르고 촘촘한 QR도 잘 읽힘).
// 못 찾는 동안에는 전체 화면(캡쳐보드, QR이 한쪽에 있을 때)과 가운데 정사각형(손에 든 카메라)을 번갈아 본다.
let roi = null, roiMiss = 0, flip = 0, lastW = 0, lastH = 0;

async function scanVideo() {
  if (vid.readyState < 2 || !vid.videoWidth) return;
  await scanSource(vid, vid.videoWidth, vid.videoHeight);
}

async function scanSource(source, w, h, session = loopToken) {
  if (det) {
    try {
      const results = await det.detect(source);
      if (session === loopToken) results.forEach(r => take(r.rawValue));
      return;
    }
    catch (e) { det = null; engine = 'jsQR'; footer(); }
  }
  if (session !== loopToken) return;
  if (w !== lastW || h !== lastH) { roi = null; lastW = w; lastH = h; }
  let sx, sy, sw, sh, max;
  if (roi) { ({ sx, sy, sw, sh } = roi); max = 1400; }
  else if ((flip ^= 1)) { sx = 0; sy = 0; sw = w; sh = h; max = 1280; }
  else { const sq = Math.min(w, h); sx = (w - sq) / 2; sy = (h - sq) / 2; sw = sh = sq; max = 1000; }
  const k = Math.min(1, max / Math.max(sw, sh)), tw = Math.round(sw * k), th = Math.round(sh * k);
  work.width = tw; work.height = th;
  wctx.drawImage(source, sx, sy, sw, sh, 0, 0, tw, th);
  const r = jsQR(wctx.getImageData(0, 0, tw, th).data, tw, th, { inversionAttempts: 'dontInvert' });
  if (r) {
    const L = r.location, ps = [L.topLeftCorner, L.topRightCorner, L.bottomLeftCorner, L.bottomRightCorner];
    const xs = ps.map(p => sx + p.x / k), ys = ps.map(p => sy + p.y / k);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const m = Math.max(x1 - x0, y1 - y0) * 0.25, nx = Math.max(0, x0 - m), ny = Math.max(0, y0 - m);
    roi = { sx: nx, sy: ny, sw: Math.min(w, x1 + m) - nx, sh: Math.min(h, y1 + m) - ny };
    roiMiss = 0;
    take(r.data);
  } else if (roi && ++roiMiss > 6) roi = null;
}

// ── 이미지 파일에서 읽기 ──
$('imgIn').onchange = async e => {
  let found = 0;
  for (const f of e.target.files) {
    try {
      const bmp = await createImageBitmap(f);
      let texts = [];
      if (det) { try { texts = (await det.detect(bmp)).map(r => r.rawValue); } catch (err) {} }
      if (!texts.length) {
        const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
        work.width = w; work.height = h;
        wctx.drawImage(bmp, 0, 0, w, h);
        const r = jsQR(wctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
        if (r) texts = [r.data];
      }
      texts.forEach(t => { if (take(t)) found++; });
    } catch (err) {}
  }
  e.target.value = '';
  if (!found) say('고른 이미지에서 송신용 QR을 찾지 못했습니다.', true);
};

// ── 프레임 처리 ──
// 프레임 형식: "QX" + 전송id(4) + 순번(3) + 전체수(3) + Base45 데이터 (모두 36진수 대문자)
function unb45(s) {
  const o = [];
  for (let i = 0; i < s.length; i += 3) {
    const c = A.indexOf(s[i]), d = A.indexOf(s[i + 1]);
    if (c < 0 || d < 0) return null;
    if (i + 2 < s.length) {
      const e = A.indexOf(s[i + 2]);
      if (e < 0) return null;
      const x = c + d * 45 + e * 2025;
      if (x > 65535) return null;
      o.push(x >> 8, x & 255);
    } else {
      const x = c + d * 45;
      if (x > 255) return null;
      o.push(x);
    }
  }
  return Uint8Array.from(o);
}

function take(s) {
  const m = /^QX([0-9A-Z]{4})([0-9A-Z]{3})([0-9A-Z]{3})/.exec(s || '');
  if (!m) return false;
  const id = m[1], i = parseInt(m[2], 36), n = parseInt(m[3], 36);
  if (!n || i >= n || done.has(id)) return true;
  if (!cur || cur.id !== id) begin(id, n);
  if (cur.parts[i]) return true;
  const b = unb45(s.slice(12));
  if (!b) return false;
  cur.parts[i] = b; cur.got++;
  paint(i);
  status();
  if (cur.got === cur.n) finish(cur);
  return true;
}

function begin(id, n) {
  cur = { id, n, parts: new Array(n), got: 0, t0: performance.now() };
  layoutGrid();
  say('');
}

// ── 진행 모자이크 ──
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function layoutGrid() {
  if (!cur) { grid.width = grid.height = 0; grid.style.width = grid.style.height = '0'; return; }
  const n = cur.n, W = Math.max(200, grid.parentElement.clientWidth), dpr = devicePixelRatio || 1;
  let cols = n < 12 ? n : Math.ceil(Math.sqrt(n * 4));
  let cs = Math.min(36, Math.floor(W / cols));
  if (cs < 4) { cs = 4; cols = Math.floor(W / cs); }
  cols = Math.min(cols, n);
  const rows = Math.ceil(n / cols);
  cur.cols = cols; cur.cs = cs; cur.cGot = css('--got'); cur.cCell = css('--cell');
  grid.width = Math.round(cols * cs * dpr); grid.height = Math.round(rows * cs * dpr);
  grid.style.width = cols * cs + 'px'; grid.style.height = rows * cs + 'px';
  for (let i = 0; i < n; i++) paint(i);
}

function paint(i) {
  if (!cur || !cur.cs) return;
  const g = grid.getContext('2d'), dpr = devicePixelRatio || 1, cs = cur.cs;
  const gap = cs >= 8 ? 2 : cs >= 5 ? 1 : 0;
  const x = (i % cur.cols) * cs, y = Math.floor(i / cur.cols) * cs;
  g.fillStyle = cur.parts[i] ? cur.cGot : cur.cCell;
  g.fillRect(Math.round(x * dpr), Math.round(y * dpr), Math.round((cs - gap) * dpr), Math.round((cs - gap) * dpr));
}

addEventListener('resize', () => cur && layoutGrid());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cur && layoutGrid());

function status() {
  if (!cur) { cnt.textContent = '0 / 0'; rate.textContent = 'QR을 기다리는 중'; return; }
  const sec = (performance.now() - cur.t0) / 1000;
  cnt.textContent = cur.got + ' / ' + cur.n;
  const pct = Math.floor(cur.got / cur.n * 100);
  rate.textContent = cur.got === cur.n ? '완료' : pct + '%, ' + sec.toFixed(0) + '초 경과';
  const miss = cur.n - cur.got;
  if (miss > 0 && miss <= 12 && cur.got > 0) {
    const m = [];
    for (let i = 0; i < cur.n; i++) if (!cur.parts[i]) m.push(i + 1);
    say('남은 프레임: ' + m.join(', '));
  }
}
setInterval(() => cur && cur.got < cur.n && status(), 1000);

function say(t, err) { note.textContent = t; note.classList.toggle('err', !!err); }

// ── 완성 ──
const kb = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';

async function finish(c) {
  done.add(c.id);
  const sec = (performance.now() - c.t0) / 1000;
  const all = new Uint8Array(c.parts.reduce((a, p) => a + p.length, 0));
  let o = 0;
  for (const p of c.parts) { all.set(p, o); o += p.length; }
  try {
    const ml = all[0] << 8 | all[1];
    const meta = JSON.parse(new TextDecoder().decode(all.subarray(2, 2 + ml)));
    let data = all.subarray(2 + ml);
    if (meta.z) {
      if (!('DecompressionStream' in window)) throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다');
      data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    }
    addResult(meta, data, sec);
    say('받기 완료. 다른 전송을 비추면 이어서 받습니다.');
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) {
    say('데이터를 복원하지 못했습니다: ' + e.message, true);
  }
}

function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props || {});
  kids.forEach(k => k != null && e.append(k));
  return e;
}

function addResult(meta, data, sec) {
  const item = el('div', { className: 'item' });
  const metaTxt = (meta.x ? new TextDecoder().decode(data).length + '자' : kb(data.length)) + ', ' + sec.toFixed(1) + '초';
  const isText = !!meta.x;
  const name = isText ? '텍스트' : (meta.n || 'received.bin');
  item.append(el('div', { className: 'head' }, el('span', { className: 'name', textContent: name }), el('span', { className: 'meta', textContent: metaTxt })));
  if (meta.s != null && meta.s !== data.length)
    item.append(el('div', { className: 'warn', textContent: '크기가 원본과 다릅니다 (원본 ' + kb(meta.s) + ')' }));

  const acts = el('div', { className: 'acts' });
  if (isText) {
    const text = new TextDecoder().decode(data);
    const ta = el('textarea', { readOnly: true, value: text });
    item.append(ta);
    const copy = el('button', { textContent: '복사' });
    copy.onclick = async () => {
      if (app) app.copyText(text);
      else {
        try { await navigator.clipboard.writeText(text); }
        catch (e) { ta.select(); document.execCommand('copy'); }
      }
      copy.textContent = '복사됨';
      setTimeout(() => copy.textContent = '복사', 1500);
    };
    acts.append(copy);
    if (app) {
      const sv = el('button', { textContent: '.txt로 저장' });
      sv.onclick = () => app.saveFile(toB64(data), 'text.txt', 'text/plain');
      const sh = el('button', { textContent: '공유' });
      sh.onclick = () => app.shareText(text);
      acts.append(sv, sh);
    } else {
      const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
      acts.append(el('a', { className: 'btn', href: URL.createObjectURL(blob), download: 'text.txt', textContent: '.txt로 저장' }));
    }
  } else {
    const type = meta.t || 'application/octet-stream';
    const file = new File([data], name, { type });
    const url = URL.createObjectURL(file);
    if (/^image\//.test(type)) item.append(el('img', { src: url, alt: name }));
    if ((/^text\/|json|xml|javascript/.test(type) || /\.(txt|md|csv|json|log)$/i.test(name)) && data.length < 200000)
      item.append(el('textarea', { readOnly: true, value: new TextDecoder().decode(data) }));
    if (app) {
      const sv = el('button', { textContent: '저장' });
      sv.onclick = () => app.saveFile(toB64(data), name, type);
      const sh = el('button', { textContent: '공유' });
      sh.onclick = () => app.shareFile(toB64(data), name, type);
      acts.append(sv, sh);
    } else acts.append(el('a', { className: 'btn', href: url, download: name, textContent: '저장' }));
    if (!app && navigator.canShare && navigator.canShare({ files: [file] })) {
      const sh = el('button', { textContent: '공유' });
      sh.onclick = () => navigator.share({ files: [file], title: name }).catch(() => {});
      acts.append(sh);
    }
  }
  item.append(acts);
  list.prepend(item);
}

$('resetBtn').onclick = () => {
  cur = null; done.clear();
  layoutGrid(); status(); say('');
};
</script>
</body>
</html>
